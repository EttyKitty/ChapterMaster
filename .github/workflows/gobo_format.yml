name: Format Code

on:
  pull_request:
    types:
      - opened
      - edited
      - ready_for_review
      - synchronize

jobs:
  format:
    runs-on: ubuntu-latest  # Or 'windows-latest' if using Windows runner

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Fetch
        run: |
          git fetch --all

      - name: Download Release
        run: |
          curl -LO https://github.com/Pizzaandy/Gobo/releases/download/v0.4.0/gobo-ubuntu.zip

      - name: Extract ZIP
        run: |
          unzip gobo-ubuntu.zip

      - name: Ensure executable permissions
        run: |
          chmod +x ./gobo

      - name: Get Changed Files
        id: changed_files
        run: |
          # Get the target branch from GitHub Actions context
          target_branch="${{ github.event.pull_request.base.ref }}"
          echo "Target branch is $target_branch"

          # Compare the PR branch with the target branch (e.g., main)
          changed_files=$(git diff --name-only HEAD..origin/$target_branch | grep '\.rs$' || true)
          echo "changed_files=$changed_files" >> $GITHUB_ENV

      - name: Run Formatter on Changed Files
        run: |
          if [ -n "$changed_files" ]; then
            # Iterate over each file using a for loop
            for file in $changed_files; do
              echo "Formatting $file"
              ./gobo-linux "$file"  # Run formatter on each changed file
            done
          else
            echo "No files changed, skipping formatting."
          fi

      - name: Clean up Gobo Files
        run: |
          rm -rf gobo-ubuntu.zip gobo

      - name: Check for formatting changes
        run: |
          git diff --quiet --exit-code || exit 1
